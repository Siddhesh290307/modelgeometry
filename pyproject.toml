[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelgeometry"
version = "0.1.1"
description = "Architecture-agnostic inspection of weight-space geometry, attention geometry, and curvature (Fisher / K-FAC) for trained PyTorch models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Siddhesh Nadkarni" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "transformers", "timm", "matplotlib"]
report = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/Siddhesh290307/modelgeometry"
Issues = "https://github.com/Siddhesh290307/modelgeometry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgeometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
